<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article lifecycle / State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0f172a;
      --color-ink:     #f8fafc;
      --color-muted:   #cbd5e1;
      --color-accent:  #fdba75;
      --font-sans:     'JetBrains Mono', ui-monospace, monospace;
      --font-serif:    'JetBrains Mono', ui-monospace, monospace;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  
    /* Hover: a node box takes the accent fill while the pointer is over it. */
    svg text { pointer-events: none; }
    svg .node-box { transition: fill .12s ease, stroke .12s ease; }
    @media (hover: hover) {
      svg .node-box:hover, svg .node:hover .node-box { fill: rgba(253,186,117,0.22); stroke: #fdba75; }
      svg .node:hover text { fill: #f8fafc; }
    }
    @media (prefers-reduced-motion: reduce) { svg .node-box { transition: none; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine / Diagram Design</p>
    <h1>Article lifecycle</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-dark-title state-dark-desc">
      <title id="state-dark-title">Article lifecycle</title>
      <desc id="state-dark-desc">State machine showing an article moving from Draft through In Review and Published to Archived, including rejection and revision.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(248,250,252,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#cbd5e1"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fdba75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0f172a"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Transitions (drawn first) -->
        <!-- Start → Draft -->
        <line x1="68" y1="200" x2="120" y2="200" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Draft → In Review -->
        <line x1="280" y1="200" x2="340" y2="200" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- In Review → Published (coral — happy path) -->
        <line x1="500" y1="200" x2="560" y2="200" stroke="#fdba75" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Published → Archived (down) -->
        <line x1="640" y1="240" x2="640" y2="300" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Archived → End (down) -->
        <line x1="640" y1="400" x2="640" y2="432" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- In Review → Draft (curved back up-and-left) -->
        <path d="M 420 160 C 420 96, 200 96, 200 160" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Transition labels -->
        <rect x="172" y="184" width="48" height="12" fill="#0f172a"/>
        <text x="196" y="194" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CREATE</text>

        <rect x="288" y="184" width="48" height="12" fill="#0f172a"/>
        <text x="312" y="194" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

        <rect x="500" y="184" width="60" height="12" fill="#0f172a"/>
        <text x="530" y="194" fill="#fdba75" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

        <rect x="612" y="264" width="56" height="12" fill="#0f172a"/>
        <text x="640" y="274" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXPIRE</text>

        <rect x="620" y="416" width="40" height="12" fill="#0f172a"/>
        <text x="640" y="426" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PURGE</text>

        <!-- Reject label on curved path -->
        <rect x="276" y="92" width="80" height="12" fill="#0f172a"/>
        <text x="316" y="102" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REJECT / REVISE</text>

        <!-- Start dot (filled ink) -->
        <circle cx="60" cy="200" r="6" fill="#f8fafc"/>

        <!-- State: Draft -->
        <rect class="node-box" x="120" y="160" width="160" height="80" fill="#1e293b" stroke="#f8fafc" stroke-width="1"/>
        <rect x="128" y="168" width="40" height="12" fill="transparent" stroke="rgba(248,250,252,0.40)" stroke-width="0.8"/>
        <text x="148" y="177" fill="#f8fafc" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="200" y="208" fill="#f8fafc" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Draft</text>
        <text x="200" y="224" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">unpublished</text>

        <!-- State: In Review -->
        <rect class="node-box" x="340" y="160" width="160" height="80" fill="#1e293b" stroke="#f8fafc" stroke-width="1"/>
        <rect x="348" y="168" width="40" height="12" fill="transparent" stroke="rgba(248,250,252,0.40)" stroke-width="0.8"/>
        <text x="368" y="177" fill="#f8fafc" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="420" y="208" fill="#f8fafc" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">In Review</text>
        <text x="420" y="224" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">awaiting approval</text>

        <!-- State: Published (focal coral) -->
        <rect class="node-box" x="560" y="160" width="160" height="80" fill="rgba(253,186,117,0.08)" stroke="#fdba75" stroke-width="1"/>
        <rect x="568" y="168" width="40" height="12" fill="transparent" stroke="rgba(253,186,117,0.50)" stroke-width="0.8"/>
        <text x="588" y="177" fill="#fdba75" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="208" fill="#f8fafc" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Published</text>
        <text x="640" y="224" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">live on site</text>

        <!-- State: Archived -->
        <rect class="node-box" x="560" y="300" width="160" height="100" fill="rgba(248,250,252,0.05)" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="568" y="308" width="40" height="12" fill="transparent" stroke="rgba(203,213,225,0.50)" stroke-width="0.8"/>
        <text x="588" y="317" fill="#cbd5e1" font-size="7" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="640" y="348" fill="#f8fafc" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Archived</text>
        <text x="640" y="364" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">noindex / hidden</text>
        <text x="640" y="382" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">redirect retained</text>

        <!-- End ring dot -->
        <circle cx="640" cy="440" r="8" fill="none" stroke="#f8fafc" stroke-width="1"/>
        <circle cx="640" cy="440" r="5" fill="#f8fafc"/>
      </svg>
  </div>
</body>
</html>
