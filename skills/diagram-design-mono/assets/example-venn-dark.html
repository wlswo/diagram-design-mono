<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good design / Desirable × Feasible × Viable</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0f172a;
      --color-ink:     #f8fafc;
      --color-muted:   #cbd5e1;
      --color-accent:  #fdba75;
      --font-sans:     'JetBrains Mono', ui-monospace, monospace;
      --font-serif:    'JetBrains Mono', ui-monospace, monospace;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  
    /* Hover: a node box takes the accent fill while the pointer is over it. */
    svg text { pointer-events: none; }
    svg .node-box { transition: fill .12s ease, stroke .12s ease; }
    @media (hover: hover) {
      svg .node-box:hover, svg .node:hover .node-box { fill: rgba(253,186,117,0.22); stroke: #fdba75; }
      svg .node:hover text { fill: #f8fafc; }
    }
    @media (prefers-reduced-motion: reduce) { svg .node-box { transition: none; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Venn / Diagram Design</p>
    <h1>Good design / Desirable × Feasible × Viable</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="venn-dark-title venn-dark-desc">
      <title id="venn-dark-title">Good design / Desirable × Feasible × Viable</title>
      <desc id="venn-dark-desc">Venn diagram showing desirable, feasible, and viable product qualities intersecting at shippable.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(248,250,252,0.10)"/>
          </pattern>
          <clipPath id="clip-center">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-center-2">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="100%" height="100%" fill="#0f172a"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle class="node-box" cx="500" cy="180" r="140" fill="rgba(248,250,252,0.04)" stroke="#f8fafc" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle class="node-box" cx="428" cy="320" r="140" fill="rgba(203,213,225,0.05)" stroke="#cbd5e1" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle class="node-box" cx="572" cy="320" r="140" fill="rgba(142,140,131,0.05)" stroke="#94a3b8" stroke-width="1"/>

        <!-- Coral focal tint on the all-three intersection -->
        <g clip-path="url(#clip-center)">
          <g clip-path="url(#clip-center-2)">
            <circle class="node-box" cx="572" cy="320" r="140" fill="rgba(253,186,117,0.14)"/>
          </g>
        </g>

        <!-- Set labels -->
        <text x="500" y="20" fill="#f8fafc" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Desirable</text>
        <text x="500" y="36" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PEOPLE WANT IT</text>

        <text x="152" y="400" fill="#cbd5e1" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">Feasible</text>
        <text x="152" y="416" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.14em">WE CAN BUILD IT</text>

        <text x="848" y="400" fill="#94a3b8" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">Viable</text>
        <text x="848" y="416" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">BUSINESS SUSTAINS</text>

        <!-- Pairwise intersection labels -->
        <text x="360" y="232" fill="#cbd5e1" font-size="12" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Prototype</text>
        <text x="360" y="248" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">no business model</text>

        <text x="640" y="232" fill="#cbd5e1" font-size="12" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Vaporware</text>
        <text x="640" y="248" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">can't build it</text>

        <text x="500" y="368" fill="#cbd5e1" font-size="12" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Internal tool</text>
        <text x="500" y="384" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">nobody wants it</text>

        <!-- Focal: all-three center -->
        <text x="500" y="260" fill="#fdba75" font-size="14" font-weight="600" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Shippable</text>
        <text x="500" y="276" fill="#cbd5e1" font-size="9" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THE SWEET SPOT</text>

        <!-- Legend strip -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(248,250,252,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#cbd5e1" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="none" stroke="#fdba75" stroke-width="1.2"/>
        <text x="68" y="492" fill="#cbd5e1" font-size="8.5" font-family="'JetBrains Mono', ui-monospace, monospace">All three — ship it</text>

        <circle cx="192" cy="488" r="6" fill="none" stroke="#cbd5e1" stroke-width="1"/>
        <text x="208" y="492" fill="#cbd5e1" font-size="8.5" font-family="'JetBrains Mono', ui-monospace, monospace">Two of three — incomplete</text>

        <text x="380" y="492" fill="#cbd5e1" font-size="8.5" font-family="'JetBrains Mono', ui-monospace, monospace" font-style="italic">Coral marks the intersection that earns the work. The others name the traps.</text>
      </svg>
  </div>
</body>
</html>
